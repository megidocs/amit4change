<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon-32.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <h1><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
    {% include nav.html %}
  </header>

  <div class="page-body">
    <main class="site-content">
      {{ content }}
    </main>

    <aside class="profile-sidebar">
      <img src="{{ '/assets/images/profile-sidebar.jpg' | relative_url }}" alt="עמית פלטי">
      <p class="profile-name"><a href="https://amit4changedotcom.wordpress.com/">עמית פלטי</a></p>
      <p class="profile-contact">0543339618<br>amit.palti@gmail.com</p>
      <p class="profile-quote">"אי אפשר ללמד אדם דבר, ניתן רק לעזור לו לגלות זאת בעצמו" – גלילאו.</p>
    </aside>
  </div>

  <footer class="site-footer">
    <p>תשפ"ז</p>
  </footer>
</body>
</html>
